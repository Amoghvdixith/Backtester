# OPTIONAL market-data variant of sma.yaml (requires scripts/download_market_data.py).
# US sector ETFs chosen today: NOT point-in-time; selection/survivorship bias remains.
experiment: sma_crossover_market
seed: 7

data:
  mode: market
  path: data/market/us_sector_etfs.csv

strategy:
  name: sma_crossover
  params: {fast: 50, slow: 200, allow_short: false}

sizing: {type: equal_weight, target_gross: 1.0}
constraints: {max_gross: 1.0, max_net: 1.0, max_position: 0.5, allow_short: false}

costs:
  commission: {rate_bps: 1.0, minimum: 1.0}
  spread: {spread_bps: 2.0}
  slippage: {bps: 1.0}
  impact: {coefficient: 0.5, fallback_bps: 5.0}

execution: {expires_after: 5, insufficient_cash: resize, adv_window: 20, vol_window: 20}
financing: {credit_rate: 0.0, debit_rate: 0.04, borrow_fee: 0.005, day_count_basis: 365}

backtest:
  initial_cash: 1000000
  fractional: false
  rebalance_band: 0.02
  cash_buffer: 0.005
  universe_exit: liquidate

benchmark: {name: equal_weight_universe, params: {min_history: 1, rebalance: monthly}}
# No historical T-bill series is bundled; cash earns 0 and Sharpe uses rf = 0.  This
# understates cash returns in high-rate periods (documented limitation).
risk_free_annual: 0.0
