# SMA crossover demonstration (offline, SYNTHETIC data).
# Parameters 50/200 are a conventional a-priori choice, not tuned on this sample.
experiment: sma_crossover
seed: 7

data:
  mode: synthetic
  path: data/synthetic/etf_like.csv        # 6 ETF-like assets, no listings/delistings
  # membership: (none -> static universe)

strategy:
  name: sma_crossover
  params: {fast: 50, slow: 200, allow_short: false}

sizing: {type: equal_weight, target_gross: 1.0}       # split capital across ACTIVE signals
constraints: {max_gross: 1.0, max_net: 1.0, max_position: 0.5, allow_short: false}

costs:                                  # detailed model (assumptions, not calibrated)
  commission: {rate_bps: 1.0, minimum: 1.0}
  spread: {spread_bps: 4.0}             # FULL quoted spread; half is paid per trade
  slippage: {bps: 1.0}                  # deterministic adverse slippage
  impact: {coefficient: 0.5, fallback_bps: 5.0}   # sqrt impact with LAGGED sigma/ADV

execution: {expires_after: 5, insufficient_cash: resize, adv_window: 20, vol_window: 20}
financing: {credit_rate: 0.02, debit_rate: 0.04, borrow_fee: 0.005, day_count_basis: 365}

backtest:
  initial_cash: 1000000
  fractional: false
  rebalance_band: 0.02
  cash_buffer: 0.005
  universe_exit: liquidate
  liquidate_on_final_open: false

benchmark: {name: equal_weight_universe, params: {min_history: 1, rebalance: monthly}}
risk_free_annual: 0.02                  # same rate as cash credit; used for Sharpe/Sortino
